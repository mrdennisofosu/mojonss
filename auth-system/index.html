<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light dark" />
  <title>Auth System</title>
  <script>
    // Apply the saved theme before the page paints, so there is no flash
    (function () {
      try {
        var saved = localStorage.getItem("theme-preference");
        var allowed = ["light", "dim", "dark", "system"];
        if (allowed.indexOf(saved) === -1) saved = "system";
        var theme =
          saved === "system"
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light"
            : saved;
        var root = document.documentElement;
        root.setAttribute("data-theme", theme);
        root.style.colorScheme = theme === "light" ? "light" : "dark";
      } catch (error) {
        /* storage blocked: the app falls back to the default look */
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
